<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>2048</title>
  <style>
    html, body { margin: 0; height: 100%; background: #e6e6e6; overflow: hidden; overscroll-behavior: none; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; outline: none; max-width: 100vw; max-height: 100vh; object-fit: contain; }
    /* Let our swipe handler own touches: no scrolling, zooming or pull-to-refresh */
    html, body, canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <script>
    var Module = { canvas: document.getElementById("canvas") };
    // Keep arrow keys from scrolling the page
    window.addEventListener("keydown", function (e) {
      if (e.key.startsWith("Arrow") || e.key === " ") e.preventDefault();
    });

    // Swipe gestures: emscripten's GLFW reads `keyCode`, so swipes are turned
    // into synthetic arrow key presses. Taps still reach the game as mouse clicks.
    (function () {
      var MIN_SWIPE = 30; // px
      var start = null;

      function pressKey(key, keyCode) {
        ["keydown", "keyup"].forEach(function (type) {
          var e = new KeyboardEvent(type, { key: key, bubbles: true, cancelable: true });
          Object.defineProperty(e, "keyCode", { get: function () { return keyCode; } });
          Object.defineProperty(e, "which", { get: function () { return keyCode; } });
          window.dispatchEvent(e);
        });
      }

      window.addEventListener("touchstart", function (e) {
        start = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
      }, { passive: true });

      window.addEventListener("touchmove", function (e) {
        e.preventDefault();
      }, { passive: false });

      window.addEventListener("touchend", function (e) {
        if (!start) return;
        var t = e.changedTouches[0];
        var dx = t.clientX - start.x, dy = t.clientY - start.y;
        start = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < MIN_SWIPE) return;

        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > 0) pressKey("ArrowRight", 39); else pressKey("ArrowLeft", 37);
        } else {
          if (dy > 0) pressKey("ArrowDown", 40); else pressKey("ArrowUp", 38);
        }
      }, { passive: true });

      window.addEventListener("touchcancel", function () { start = null; });
    })();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
